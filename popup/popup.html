<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="place" id="place" hidden>
        <div class="place-name" id="placeName"></div>
        <div class="place-sub"><span class="mono" id="placeRating"></span> · <span class="mono" id="placeCount"></span> reviews</div>
      </div>
      <div class="brand" id="brand">Momus</div>
      <button id="viewToggle" class="btn" hidden>New scrape</button>
    </header>

    <main class="body" id="scrapeView" hidden>
      <section class="card">
        <div class="eyebrow">Scrape this place</div>
        <div class="cap">Open an apartment on Google Maps, then read its reviews.</div>
        <div class="option-row">
          <label for="maxReviews">Reviews to read</label>
          <select id="maxReviews">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="300">300</option>
            <option value="500" selected>500</option>
            <option value="0">All (slow)</option>
          </select>
        </div>
        <div class="option-row">
          <label for="sortOrder">Order</label>
          <select id="sortOrder">
            <option value="relevant">Most relevant</option>
            <option value="newest">Newest</option>
            <option value="highest">Highest rating</option>
            <option value="lowest">Lowest rating</option>
          </select>
        </div>
        <div id="status" class="status">Ready</div>
        <button id="scrapeBtn" class="btn btn-primary btn-wide">Scrape reviews</button>
      </section>

      <section class="card">
        <div class="eyebrow">Bulk scrape</div>
        <div class="cap">Paste Google Maps place links, one per line. Each is saved as its own JSON file.</div>
        <textarea id="bulkUrls" placeholder="https://www.google.com/maps/place/..."></textarea>
        <div class="bulk-controls">
          <button id="startBulkBtn" class="btn btn-sm">Start</button>
          <button id="cancelBulkBtn" class="btn btn-sm">Cancel</button>
        </div>
        <div id="bulkProgress" class="bulk-progress" hidden>
          <div class="progress-text" id="bulkProgressText">Scraping 0/0...</div>
          <div class="progress-bar"><div id="bulkProgressBar" class="progress-fill"></div></div>
        </div>
      </section>
    </main>

    <main class="body" id="resultsView" hidden></main>

    <footer class="footer" id="footer" hidden>
      <button id="copyBtn" class="btn btn-sm">Copy summary</button>
      <button id="downloadBtn" class="btn btn-sm">Download JSON</button>
    </footer>
  </div>

  <script src="../lib/browser.js"></script>
  <script src="../content/keywords.js"></script>
  <script src="summarize.js"></script>
  <script src="popup.js"></script>
</body>
</html>
